name: Build AimLine Lab Touch Fix APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore proven source and fix Android touch passthrough
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, re, subprocess, zipfile
          previous = subprocess.check_output([
              'git', 'show',
              '19869035cd43eb5688d8724593eededd26f635cd:.github/workflows/build.yml'
          ], text=True)
          match = re.search(r"cat > payload\.b64 <<'PAYLOAD'\n(.*?)\n\s*PAYLOAD", previous, re.S)
          if not match:
              raise SystemExit('Could not locate the original successful build source')
          source = base64.b64decode(''.join(match.group(1).split()), validate=True)
          with zipfile.ZipFile(io.BytesIO(source)) as archive:
              archive.extractall('project')
          file = Path('project/app/src/main/java/com/example/aimlinelab/TraceService.kt')
          code = file.read_text(encoding='utf-8')
          original = '        overlay=AimOverlay(this).also {windowManager.addView(it,params)}'
          if code.count(original) != 1:
              raise SystemExit('Overlay source changed; refusing an unsafe patch')
          code = code.replace(original, '        params.alpha = 0.65f\n' + original)
          file.write_text(code, encoding='utf-8')
          gradle = Path('project/app/build.gradle.kts')
          settings = gradle.read_text(encoding='utf-8')
          assert 'versionCode = 1' in settings
          settings = settings.replace('versionCode = 1', 'versionCode = 2')
          settings = settings.replace('versionName = "0.1.0-test"', 'versionName = "0.1.1-touchfix"')
          gradle.write_text(settings, encoding='utf-8')
          print('Restored original successful source and applied touch-pass fix')
          PY

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK packages
        shell: bash
        run: |
          : "${ANDROID_HOME:?Android SDK missing}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Compile Android APK
        shell: bash
        working-directory: project
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AimLineLab-touchfix-v011-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
